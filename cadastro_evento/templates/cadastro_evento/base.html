<!doctype html>
<html lang="pt-br">
{% load static %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>IntegraTur</title>
  <link rel="icon" href="{% static 'imagens/favicon.ico' %}" type="image/ico">
  <style>
    body {
      background-color: #f8f9fa;
    }

    /* Topo com logo + navbar */
    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: #F8EF1F;
      z-index: 1030;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid #ccc;
    }

    .logo {
      height: 70px;
      max-width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logo:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .nav-menu {
      display: flex;
      gap: 15px;
    }

    .nav-menu .nav-link {
      color: #333;
      font-weight: bold;
      text-decoration: none;
      font-size: 1rem;
      padding: 8px 15px;
      border-radius: 5px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-menu .nav-link:hover {
      color: #0d6efd;
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .nav-menu .nav-link.active {
      color: #0d6efd !important;
      font-weight: bold;
      position: relative;
    }

    .nav-menu .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 15%;
      width: 70%;
      height: 3px;
      background-color: #0d6efd;
      border-radius: 3px;
    }

    .content {
      margin-top: 45px;
      padding: 10px;
    }

    .filtro_and_search {
      display: flex;
    }

    .form-section {
      padding: 15px;
    }

    .form-label, .form-control {
      font-size: 0.9rem;
    }

    .form-control {
      padding: 6px 10px;
    }

    .form-check {
      font-size: 0.9rem;
    }

    .btn-save {
      position: fixed;
      bottom: 20px;
      right: 20px;
    }

    .search-oficial {
      font-size: 0.9rem;
      right: 40px;
    }

    .search-input {
      text-align: center;
      border-radius: 10px;
      border-width: 1px;
      border-color: #ccc #ccc #ccc #ccc;
    }

    @media (max-width: 768px) {
      .top-header {
        padding: 0 15px;
        height: 70px;
      }
      .logo {
        height: 50px;
      }
      .nav-menu .nav-link {
        padding: 6px 10px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<div class="top-header">
  <a href="{% url 'home' %}" style="text-decoration: none;" title="Voltar para página inicial">
    <img src="{% static 'imagens/image-removebg-preview.png' %}" alt="Logo IntegraTur" class="logo">
  </a>
  
  <nav class="nav-menu">
    <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Página inicial</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'calendario' %}active{% endif %}" href="{% url 'calendario' %}">Calendário</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'cadastro' %}active{% endif %}" href="{% url 'cadastro' %}">Adicionar evento</a>
    <a class="nav-link {% if request.resolver_match.url_name == 'mapa' %}active{% endif %}" href="{% url 'mapa' %}">Mapa de evento</a>
  </nav>
</div>

<div class="content">
  {% block conteudo %}
  {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
