{% extends 'cadastro_evento/base.html' %}
{% load static %}
{% block conteudo %}
<div class="content">
  <div id="calendar" style="padding: 1rem;"></div>

  <!-- FullCalendar + SweetAlert2 CSS/JS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Custom Calendar Styles */
    .custom-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .nav-button {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #4e73df;
      padding: 5px 15px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    
    .nav-button:hover {
      background-color: #f0f0f0;
      transform: scale(1.1);
    }
    
    .period-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2c3e50;
      min-width: 200px;
      text-align: center;
    }
    
    /* Hide default FullCalendar toolbar */
    .fc-header-toolbar {
      display: none !important;
    }
    
    /* Event styles */
    .fc-event {
      cursor: pointer;
      border: none !important;
      background-color: #4e73df !important;
      padding: 5px !important;
      border-radius: 4px !important;
      margin: 2px 0 !important;
    }
    
    .fc-event:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      
      // Create custom header elements
      const customHeader = document.createElement('div');
      customHeader.className = 'custom-header';
      
      const prevButton = document.createElement('button');
      prevButton.className = 'nav-button';
      prevButton.innerHTML = '&larr;';
      
      const periodTitle = document.createElement('div');
      periodTitle.className = 'period-title';
      
      const nextButton = document.createElement('button');
      nextButton.className = 'nav-button';
      nextButton.innerHTML = '&rarr;';
      
      // Insert custom header
      customHeader.appendChild(prevButton);
      customHeader.appendChild(periodTitle);
      customHeader.appendChild(nextButton);
      calendarEl.parentNode.insertBefore(customHeader, calendarEl);
      
      // Initialize calendar
      const calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'pt-br',
        initialView: 'dayGridMonth',
        headerToolbar: false, // Hide default toolbar
        firstDay: 0, // Start week on Sunday
        
        // View switching buttons
        headerToolbar: {
          left: '',
          center: '',
          right: ''
        },
        
        events: '{% url "events_json" %}',
        
        // Update title when view changes
        datesSet: function(info) {
          const viewType = info.view.type;
          let title = '';
          
          if (viewType === 'dayGridMonth') {
            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
                               "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            title = `${monthNames[info.view.currentStart.getMonth()]} ${info.view.currentStart.getFullYear()}`;
          } 
          else if (viewType === 'timeGridWeek') {
            const start = info.view.currentStart;
            const end = new Date(start);
            end.setDate(end.getDate() + 6);
            
            title = `${start.getDate()} - ${end.getDate()} ${start.toLocaleDateString('pt-BR', { month: 'long' })}`;
          } 
          else if (viewType === 'timeGridDay') {
            title = info.view.currentStart.toLocaleDateString('pt-BR', { 
              weekday: 'long', 
              day: 'numeric', 
              month: 'long' 
            });
          }
          
          periodTitle.textContent = title;
        },
        
        // Event display
        eventContent: function(arg) {
          return {
            html: `<div class="fc-event-content">${arg.event.title}</div>`
          };
        },
        
        // Event click handler
        eventClick: function(info) {
          info.jsEvent.preventDefault();
          
          Swal.fire({
            title: info.event.title,
            html: `
              <div class="text-start">
                <p><strong>📅 Data:</strong> ${info.event.start.toLocaleDateString('pt-BR', { 
                  day: '2-digit', 
                  month: 'long', 
                  year: 'numeric' 
                })}</p>
                ${info.event.extendedProps.descricao ? 
                  `<p><strong>📝 Descrição:</strong> ${info.event.extendedProps.descricao}</p>` : ''}
                ${info.event.extendedProps.local ? 
                  `<p><strong>📍 Local:</strong> ${info.event.extendedProps.local}</p>` : ''}
              </div>
            `,
            showCloseButton: true,
            showConfirmButton: false,
            width: '600px',
            background: '#fff',
            customClass: {
              popup: 'border-radius-8',
              title: 'text-primary mb-3'
            }
          });
        }
      });
      
      calendar.render();
      
      // Navigation button handlers
      prevButton.addEventListener('click', function() {
        calendar.prev();
      });
      
      nextButton.addEventListener('click', function() {
        calendar.next();
      });
      
      // Optional: Add view switcher buttons if needed
      const viewSwitcher = document.createElement('div');
      viewSwitcher.style.textAlign = 'center';
      viewSwitcher.style.marginBottom = '15px';
      
      ['Mês', 'Semana', 'Dia'].forEach(viewType => {
        const button = document.createElement('button');
        button.textContent = viewType;
        button.style.margin = '0 5px';
        button.style.padding = '5px 10px';
        button.style.borderRadius = '5px';
        button.style.border = '1px solid #ddd';
        button.style.cursor = 'pointer';
        
        button.addEventListener('click', function() {
          const viewMap = {
            'Mês': 'dayGridMonth',
            'Semana': 'timeGridWeek',
            'Dia': 'timeGridDay',
          };
          calendar.changeView(viewMap[viewType]);
        });
        
        viewSwitcher.appendChild(button);
      });
      
      customHeader.parentNode.insertBefore(viewSwitcher, calendarEl);
    });
  </script>
</div>
{% endblock %}
